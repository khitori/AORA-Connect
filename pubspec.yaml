name: aoravpn
description: "AORA VPN Client"
publish_to: 'none'

version: 1.1.5+9

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  country_flags: ^4.1.2
  url_launcher: ^6.3.3
  file_selector: ^1.1.0
  cryptography: ^2.9.0
  crypto: ^3.0.7

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:
  generate: true

  uses-material-design: true
  assets:
    - lib/assets/logo.png
    - release/update-public-key.txt
