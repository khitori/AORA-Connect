[package]
name = "aora-windows-helpers"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

[features]
portable = []
runner = []
migration-fixture = []

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
base64 = "0.22"
ed25519-dalek = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
windows-sys = { version = "=0.59.0", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem",
  "Win32_System_Console", "Win32_System_Threading", "Win32_System_IO",
  "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell",
  "Win32_System_Rpc", "Win32_System_Registry",
  "Win32_System_JobObjects", "Win32_System_LibraryLoader",
  "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Networking_WinSock", "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WindowsFilteringPlatform",
] }

[[bin]]
name = "aoravpn_core_host"
path = "src/bin/core_host.rs"

[[bin]]
name = "aoravpn_core_console"
path = "src/bin/core_console.rs"

[[bin]]
name = "aoravpn_server_ping"
path = "src/bin/server_ping.rs"

[[bin]]
name = "aoravpn_kill_switch"
path = "src/bin/kill_switch.rs"

[[bin]]
name = "AORAConnect"
path = "src/bin/portable.rs"
required-features = ["portable"]

[[bin]]
name = "aoravpn_update"
path = "src/bin/update.rs"

[[bin]]
name = "aoravpn_migrate"
path = "src/bin/migrate.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
